name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (compileall, unittest, ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6

      - name: Install locked backend dependencies
        run: uv sync --project backend --frozen --extra dev

      - name: Check generated requirements
        run: |
          uv export --project backend --frozen --no-dev --no-hashes --no-emit-project --no-header --output-file backend/requirements.txt
          git diff --exit-code -- backend/requirements.txt

      - name: Byte-compile backend sources
        run: uv run --project backend --frozen --extra dev python -m compileall backend/app

      - name: Ruff lint
        run: |
          uv run --project backend --frozen --extra dev ruff check backend
          uv run --project backend --frozen --extra dev ruff format --check backend

      - name: Unit tests
        working-directory: backend
        run: uv run --frozen --extra dev python -m unittest discover -s tests -v

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  browser-e2e:
    name: Browser E2E (real backend + Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6

      - name: Install locked backend dependencies
        run: uv sync --project backend --frozen --extra dev

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full review loop E2E
        env:
          AI_WRITING_E2E_PYTHON: ${{ github.workspace }}/backend/.venv/bin/python
        run: node e2e/full-review-loop.e2e.mjs

      - name: Run wiki failure E2E
        env:
          AI_WRITING_E2E_PYTHON: ${{ github.workspace }}/backend/.venv/bin/python
        run: node e2e/wiki-failure.e2e.mjs

  repository:
    name: Repository hygiene (git diff --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed lines for whitespace errors
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}..HEAD"
          else
            git diff --check "HEAD~1..HEAD"
          fi
